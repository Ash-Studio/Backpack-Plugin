name: BackpackPlugin
version: 1.0.0
main: me.ash.backpackPlugin.BackpackPlugin
api-version: '1.21'
description: A plugin that provides customizable backpacks for players
author: ash

commands:
  backpack:
    description: Opens your backpack
    usage: /backpack
    aliases: [bp]
    permission: backpack.use

permissions:
  backpack.use:
    description: Allows players to use the backpack command
    default: true
  backpack.size.small:
    description: Allows players to have a small backpack (4 rows)
    default: true
  backpack.size.medium:
    description: Allows players to have a medium backpack (5 rows)
    default: op
  backpack.size.large:
    description: Allows players to have a large backpack (6 rows)
    default: op